name: Publish to Maven Repo Branch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to local repo directory
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          ./gradlew --no-configuration-cache \
            -PVERSION_NAME="$VERSION" \
            :source-api:publishReleasePublicationToLocalRepoRepository \
            :core:common:publishReleasePublicationToLocalRepoRepository \
            :mihon-kit:publishReleasePublicationToLocalRepoRepository

      - name: Deploy to mvn-repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: mvn-repo
          publish_dir: ./repo
          keep_files: true
          commit_message: "Publish artifacts for ${{ github.ref_name }}"
